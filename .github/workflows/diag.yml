name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - run: |
          set +e
          M=https://msc.fema.gov/arcgis/rest/services
          curl -s -m 30 "$M/NFHL_Print?f=json" | head -c 600; echo
          for s in $(curl -s -m 30 "$M/NFHL_Print?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(x['name']+'/'+x['type'] for x in d.get('services',[])))"); do
            echo "== $s"; curl -s -m 30 "$M/$s?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); print([(l['id'],l['name']) for l in d.get('layers',[])][:40])"
          done

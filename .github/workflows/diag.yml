name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - run: |
          set +e
          Q=https://msc.fema.gov/arcgis/rest/services/NFHL_Print/NFHLQuery/MapServer
          curl -s -m 30 -D h.txt -H "Origin: https://floodinsurancedata.com" -o img.png -w "%{http_code} %{content_type} %{size_download}B %{time_total}s\n" "$Q/export?bbox=-8918000,3089000,-8917000,3090000&bboxSR=3857&imageSR=3857&size=256,256&layers=show:28&transparent=true&format=png32&f=image"
          file img.png

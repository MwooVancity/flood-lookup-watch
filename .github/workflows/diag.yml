name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - run: |
          set +e
          for u in "https://hazards.fema.gov/arcgis/rest/services?f=json" "https://hazards.fema.gov/gis/nfhl/rest/services/public/NFHL/MapServer?f=json" "https://msc.fema.gov/arcgis/rest/services?f=json" "https://msc.fema.gov/portal/home" "https://www.fema.gov/flood-maps/national-flood-hazard-layer"; do
            curl -s -m 30 -o out.txt -w "%{http_code} %{time_total}s " "$u"; head -c 90 out.txt | tr '\n\r' '  '; echo " <- $u"
          done
